name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Render deterministic smoke artifact
        run: python example_render.py
      - name: Verify smoke outputs exist
        run: test -s out/procedural-zap.wav && test -s out/procedural-zap.receipt.json
