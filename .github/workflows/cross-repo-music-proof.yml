name: cross-repo music proof

on:
  push:
  pull_request:

jobs:
  music-maker-to-audio-fabric:
    runs-on: ubuntu-latest
    env:
      MUSIC_MAKER_REF: 6257e2763cac3e64822867ce325e844a0f03cfd3
      AXM_MUSIC_MAKER_ROOT: integration/vendor/axm-music-maker
      AXM_AUDIO_PROOF_OUT: out/music-maker-cross-repo
    steps:
      - name: Checkout Audio Fabric candidate
        uses: actions/checkout@v4

      - name: Checkout pinned Music Maker source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-music-maker
          ref: ${{ env.MUSIC_MAKER_REF }}
          path: integration/vendor/axm-music-maker
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact Music Maker checkout
        run: test "$(git -C "$AXM_MUSIC_MAKER_ROOT" rev-parse HEAD)" = "$MUSIC_MAKER_REF"

      - name: Execute Music Maker -> Audio Fabric render and replay proof
        env:
          AXM_MUSIC_MAKER_REF: ${{ env.MUSIC_MAKER_REF }}
        run: python integration/prove_music_maker_chain.py

      - name: Require durable proof outputs
        run: |
          test -s "$AXM_AUDIO_PROOF_OUT/music-maker-plan.json"
          test -s "$AXM_AUDIO_PROOF_OUT/render-first.wav"
          test -s "$AXM_AUDIO_PROOF_OUT/render-first.receipt.json"
          test -s "$AXM_AUDIO_PROOF_OUT/render-replay.wav"
          test -s "$AXM_AUDIO_PROOF_OUT/render-replay.receipt.json"
          test -s "$AXM_AUDIO_PROOF_OUT/proof.json"

      - name: Preserve proof or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-maker-audio-fabric-proof-${{ github.run_id }}
          path: out/music-maker-cross-repo/
          if-no-files-found: warn
