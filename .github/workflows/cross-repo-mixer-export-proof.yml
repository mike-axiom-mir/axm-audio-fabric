name: cross-repo mixer export proof

on:
  push:
  pull_request:

jobs:
  sound-mixer-to-audio-fabric:
    runs-on: ubuntu-latest
    env:
      SOUND_MIXER_REF: 2bf21adf91954a9e895093553fd085b566994963
      AXM_SOUND_MIXER_ROOT: integration/vendor/axm-sound-mixer
      AXM_AUDIO_PROOF_OUT: out/sound-mixer-export
    steps:
      - name: Checkout Audio Fabric candidate
        uses: actions/checkout@v4

      - name: Checkout pinned Sound Mixer source
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-sound-mixer
          ref: ${{ env.SOUND_MIXER_REF }}
          path: integration/vendor/axm-sound-mixer
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact Sound Mixer checkout
        run: test "$(git -C "$AXM_SOUND_MIXER_ROOT" rev-parse HEAD)" = "$SOUND_MIXER_REF"

      - name: Execute Sound Mixer -> Audio Fabric export and replay proof
        env:
          AXM_SOUND_MIXER_REF: ${{ env.SOUND_MIXER_REF }}
        run: python integration/prove_sound_mixer_export.py

      - name: Require durable proof outputs
        run: |
          test -s "$AXM_AUDIO_PROOF_OUT/source.wav"
          test -s "$AXM_AUDIO_PROOF_OUT/source.receipt.json"
          test -s "$AXM_AUDIO_PROOF_OUT/sound-mixer-plan.json"
          test -s "$AXM_AUDIO_PROOF_OUT/mix-first.wav"
          test -s "$AXM_AUDIO_PROOF_OUT/mix-first.receipt.json"
          test -s "$AXM_AUDIO_PROOF_OUT/mix-replay.wav"
          test -s "$AXM_AUDIO_PROOF_OUT/mix-replay.receipt.json"
          test -s "$AXM_AUDIO_PROOF_OUT/proof.json"

      - name: Preserve proof or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sound-mixer-audio-fabric-export-proof-${{ github.run_id }}
          path: out/sound-mixer-export/
          if-no-files-found: warn
